<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zone Calibration & Spatial Editor - Factory Vision AI</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .calibration-container {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1.5rem;
      padding: 1.5rem;
      max-width: 1750px;
      margin: 0 auto;
      width: 100%;
    }
    .canvas-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #calibration-canvas {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      cursor: crosshair;
      background: #000;
    }
    .panel-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .control-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .input-field {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    .btn-action {
      background: var(--accent-cyan);
      color: #000;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .btn-action:hover { opacity: 0.9; }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }
    .zone-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.75rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      margin-bottom: 0.4rem;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-brand">
      <div class="brand-icon">Z</div>
      <div>
        <h1 class="brand-title">Zone Calibration & Spatial Editor</h1>
        <div style="font-size: 0.72rem; color: var(--text-muted);">Define functional zones, exclusion masks, and counting lines</div>
      </div>
    </div>
    <div class="nav-controls">
      <a href="/" class="btn-nav">← Back to Monitoring</a>
      <button class="btn-action" onclick="saveZonesAndCalibration()">Save Calibration</button>
    </div>
  </header>

  <div class="calibration-container">
    <!-- Interactive Canvas -->
    <div class="canvas-card">
      <div style="margin-bottom: 0.5rem; font-size: 0.8rem; color: var(--text-muted); width: 100%; display: flex; justify-content: space-between;">
        <span>Click on canvas to place polygon points. Click "Complete Zone" to close polygon.</span>
        <span id="canvas-coords">X: 0, Y: 0</span>
      </div>
      <canvas id="calibration-canvas" width="1280" height="576"></canvas>
    </div>

    <!-- Controls Panel -->
    <div class="panel-card">
      <h3 style="font-size: 1rem; color: var(--text-primary);">Zone Tools</h3>

      <div class="control-group">
        <label class="control-label">Zone Name</label>
        <input type="text" id="zone-name" class="input-field" placeholder="e.g. Work Area A">
      </div>

      <div class="control-group">
        <label class="control-label">Zone Type</label>
        <select id="zone-type" class="input-field">
          <option value="work">Work Area</option>
          <option value="storage">Storage Area</option>
          <option value="loading">Loading Area</option>
          <option value="pickup">Box Pickup Area</option>
          <option value="destination">Box Destination Area</option>
          <option value="exclusion">Exclusion Area (Static False-Positive Mask)</option>
        </select>
      </div>

      <div style="display: flex; gap: 0.5rem;">
        <button class="btn-action" style="flex: 1;" onclick="startDrawingZone()">+ New Zone</button>
        <button class="btn-secondary" onclick="completeCurrentZone()">Complete Zone</button>
        <button class="btn-secondary" onclick="cancelCurrentZone()">Cancel</button>
      </div>

      <div class="control-group" style="margin-top: 0.5rem;">
        <label class="control-label">Configured Zones</label>
        <div id="zones-list-container" style="max-height: 200px; overflow-y: auto;">
          <!-- Rendered via JS -->
        </div>
      </div>

      <hr style="border: none; border-top: 1px solid var(--border-color);">

      <h3 style="font-size: 0.95rem; color: var(--text-primary);">Detector Thresholds</h3>
      <div class="control-group">
        <label class="control-label">Person Confidence: <span id="val-person-conf">0.35</span></label>
        <input type="range" id="slider-person-conf" min="0.10" max="0.90" step="0.05" value="0.35" oninput="document.getElementById('val-person-conf').textContent = this.value">
      </div>

      <div class="control-group">
        <label class="control-label">Article Confidence: <span id="val-article-conf">0.40</span></label>
        <input type="range" id="slider-article-conf" min="0.10" max="0.90" step="0.05" value="0.40" oninput="document.getElementById('val-article-conf').textContent = this.value">
      </div>

      <div id="save-status" style="font-size: 0.8rem; text-align: center; color: var(--accent-green); display: none;">
        Calibration saved successfully!
      </div>
    </div>
  </div>

  <script src="/static/js/calibration.js"></script>
</body>
</html>
